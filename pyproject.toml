[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crs-sim"
version = "0.1.0"
description = "Standalone MeshCat simulator of the CRS97 and Mitsubishi RV-6S arms with the ctu_crs / ctu_mitsubishi interfaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pin>=3.0",
    "meshcat>=0.3",
    "opencv-python",
    "moderngl>=5.8",
]

[project.optional-dependencies]
dev = ["pytest"]
# CAD files (STEP, STL, ...) in Visualizer.show_mesh
step = ["trimesh>=4", "cascadio>=0.0.13"]

[tool.setuptools.packages.find]
include = ["crs_sim*"]

[tool.setuptools.package-data]
crs_sim = ["urdf/*.urdf", "urdf/meshes/*.stl"]
